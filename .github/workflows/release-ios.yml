name: Release iOS

# Manual release: optionally bump the app version, build the iOS app on EAS,
# then submit it to App Store Connect. Submission requires an App Store Connect
# API key stored on EAS (interactive Apple login does not work in CI).

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Marketing version e.g. 1.0.1 (blank = keep current app.json version)'
        required: false
        type: string

concurrency:
  group: release-ios
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # to push the version bump commit + tag
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Bump version + tag
        if: ${{ inputs.version != '' }}
        env:
          V: ${{ inputs.version }}
        run: |
          node -e "const fs=require('fs'),p='app.json',j=JSON.parse(fs.readFileSync(p));j.expo.version=process.env.V;fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n')"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "Release v$V"
          git tag "v$V"
          git push --follow-tags

      - name: Build iOS (production)
        env:
          EAS_BUILD_NO_EXPO_GO_WARNING: '1' # native build workflow; not using Expo Go
        run: eas build --platform ios --profile production --non-interactive

      - name: Submit to App Store Connect
        run: eas submit --platform ios --profile production --latest --non-interactive
