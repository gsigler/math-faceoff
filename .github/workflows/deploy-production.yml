name: Deploy production (Supabase + iOS build)

# On every push to main: push database migrations to the production Supabase
# project AND kick off a production iOS build on EAS. This never submits to the
# App Store — submission is a deliberate, manual step (see release-ios.yml).

on:
  push:
    branches: [main]
  workflow_dispatch:

# Avoid overlapping production deploys.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: production # add required reviewers in repo Settings → Environments
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_PRODUCTION_DB_PASSWORD }}
      PROJECT_REF: sglfwxpseqcftjbyadmc # math-faceoff-prod
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link production project
        run: supabase link --project-ref "$PROJECT_REF"

      - name: Push migrations
        run: supabase db push

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # Build only — no submit. --no-wait returns once the build is queued so we
      # don't hold a runner for the full build.
      - name: Build iOS (production)
        run: eas build --platform ios --profile production --non-interactive --no-wait
